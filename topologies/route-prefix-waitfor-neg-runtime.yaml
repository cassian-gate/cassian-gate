name: route-prefix-waitfor-neg-runtime

nodes:
  - name: r1
    type: frr

  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

links:
  - endpoints: ["h1:eth1", "r1:eth1"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

scenarios:
  - id: rp_negative_runtime
    description: "prefix becomes present during wait_for(expect: fail) -> must fail deterministically"
    steps:
      - wait_for:
          type: route_prefix
          from: h1
          src: r1
          prefix: 192.168.1.0/24
          expect: fail
          timeout: 5
          interval_s: 1


