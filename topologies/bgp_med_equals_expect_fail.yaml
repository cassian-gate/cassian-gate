name: bgp-med-equals-expect-fail

nodes:
  - name: r1
    type: frr
    asn: 65001
    router_id: 1.1.1.1
    bgp:
      neighbors:
        - peer: r2
          remote_as: 65002
    networks:
      - 1.1.1.1/32

  - name: r2
    type: frr
    asn: 65002
    router_id: 2.2.2.2
    bgp:
      neighbors:
        - peer: r1
          remote_as: 65001
          ipv4_unicast:
            route_map_in: RM-IN-MED-50
      route_maps:
        - name: RM-IN-MED-50
          entries:
            - seq: 10
              action: permit
              set:
                med: 50

links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.0.12.0/31", "10.0.12.1/31"]

tests:
  # Q4 (holding predicate -> verdict: fail): observed MED 50 == expected 50 (observed: pass);
  # expect: fail -> the expected failure did not occur.
  - name: q4_med_equals_50_holds_but_expect_fail
    kind: invariant
    type: bgp_med_equals
    node: r2
    prefix: 1.1.1.1/32
    expected: 50
    expect: fail
  # Q3 (failing predicate -> verdict: pass): observed MED 50 != expected 75 (observed: fail);
  # expect: fail -> the expected failure occurred.
  - name: q3_med_equals_75_mismatch_expect_fail
    kind: invariant
    type: bgp_med_equals
    node: r2
    prefix: 1.1.1.1/32
    expected: 75
    expect: fail
