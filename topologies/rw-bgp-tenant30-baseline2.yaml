name: rw-bgp-tenant30-baseline2

nodes:
  - name: leaf1
    type: frr

  - name: leaf2
    type: frr

  - name: h10
    type: host
    ip: 192.168.10.10/24
    gw: 192.168.10.1

  - name: h20
    type: host
    ip: 192.168.20.10/24
    gw: 192.168.20.1

  - name: h30
    type: host
    ip: 192.168.30.10/24
    gw: 192.168.30.1

links:
  # leaf1 <-> leaf2 underlay
  - endpoints: ["leaf1:eth1", "leaf2:eth1"]
    ipv4: ["10.0.0.0/31", "10.0.0.1/31"]

  # access nets
  - endpoints: ["h10:eth1", "leaf1:eth2"]
    ipv4: ["192.168.10.10/24", "192.168.10.1/24"]

  - endpoints: ["h20:eth1", "leaf2:eth2"]
    ipv4: ["192.168.20.10/24", "192.168.20.1/24"]

  - endpoints: ["h30:eth1", "leaf1:eth3"]
    ipv4: ["192.168.30.10/24", "192.168.30.1/24"]

tests:
  # Directly-connected reachability must pass (v1-truthful)
  - name: h10_to_leaf1_gw_ping
    kind: ping
    src: h10
    to: 192.168.10.1
    expect: pass
    count: 1

  - name: h20_to_leaf2_gw_ping
    kind: ping
    src: h20
    to: 192.168.20.1
    expect: pass
    count: 1

  - name: h30_to_leaf1_t30_gw_ping
    kind: ping
    src: h30
    to: 192.168.30.1
    expect: pass
    count: 1

  # Multi-hop tests must be declared fail in v1 (no routing inferred)
  - name: h10_to_h20_declared_fail
    kind: ping
    src: h10
    to: 192.168.20.10
    expect: fail
    count: 1

  - name: h20_to_h30_declared_fail
    kind: ping
    src: h20
    to: 192.168.30.10
    expect: fail
    count: 1

scenarios:
  - id: prove_baseline_after_apply
    description: "After applying baseline BGP candidate, h10<->h20 must PASS, h20->h30 must stay FAIL."
    steps:
      - run:
          include: all

      # Prove routing works for tenant10<->tenant20 after apply
      - wait_for:
          type: ping
          from: h10
          to: 192.168.20.10
          expect: pass
          timeout: 30
          interval_s: 1.0
          count: 2
          per_attempt_timeout_s: 2

      # Prove tenant30 is NOT reachable from h20 in baseline
      - wait_for:
          type: ping
          from: h20
          to: 192.168.30.10
          expect: fail
          timeout: 10
          interval_s: 1.0
          count: 1
          per_attempt_timeout_s: 2

