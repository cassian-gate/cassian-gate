# Phase 1a / Handover 4 of 8 — positive proof topology for the
# ospf_neighbor_up invariant (REQ-H4-11 / PROOF-1).
#
# Two FRR nodes (r1, r2) form a single-area OSPF adjacency on a
# point-to-point link. Both nodes declare area 0 and OSPF networks that
# cover (a) the auto-allocated /31 link subnet at 10.0.0.0/31 and (b)
# the per-node loopback /32 derived from router_id. Under steady state
# the OSPF FSM reaches "Full" on both sides; the declared invariant
# verifies r1 observes r2's router-id (2.2.2.2) at "Full".
#
# Auto-IP allocation (Cassian engine convention): the engine assigns
# /31 subnets sequentially from 10.0.0.0/16 in link-declaration order.
# Link 0 -> [10.0.0.0/31, 10.0.0.1/31]. The 10.0.0.0/16 supernet in
# ospf.networks therefore covers all auto-allocated link IPs.
name: ospf-neighbor-up
nodes:
  - name: r1
    type: frr
    router_id: 1.1.1.1
    ospf:
      area: 0
      networks:
        - 10.0.0.0/16
        - 1.1.1.1/32
  - name: r2
    type: frr
    router_id: 2.2.2.2
    ospf:
      area: 0
      networks:
        - 10.0.0.0/16
        - 2.2.2.2/32
links:
  - endpoints: ["r1:eth1", "r2:eth1"]
tests:
  - name: r1_neighbor_up_to_r2
    kind: invariant
    type: ospf_neighbor_up
    src: r1
    neighbor: 2.2.2.2
    expect: pass
