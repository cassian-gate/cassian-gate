name: three-frr-two-hosts-fw-routed

nodes:
  - name: r1
    type: frr
    asn: 65001
    router_id: 1.1.1.1
    static_routes:
      - "192.168.2.0/24 via 10.0.0.1"

  - name: r2
    type: frr
    asn: 65002
    router_id: 2.2.2.2
    static_routes:
      - "192.168.1.0/24 via 10.0.0.0"
      - "192.168.2.0/24 via 10.0.0.3"

  - name: r3
    type: frr
    asn: 65003
    router_id: 3.3.3.3
    static_routes:
      - "192.168.1.0/24 via 10.0.0.4"

  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: h2
    type: host
    ip: 192.168.2.10/24
    gw: 192.168.2.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 10.0.0.3/31
      eth2: 10.0.0.4/31
    routes:
      - "192.168.1.0/24 via 10.0.0.2"
      - "192.168.2.0/24 via 10.0.0.5"
    allow_icmp: true
    allow_tcp: [443]

links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.0.0.0/31", "10.0.0.1/31"]

  - endpoints: ["r2:eth2", "fw1:eth1"]
    ipv4: ["10.0.0.2/31", "10.0.0.3/31"]

  - endpoints: ["fw1:eth2", "r3:eth1"]
    ipv4: ["10.0.0.4/31", "10.0.0.5/31"]

  - endpoints: ["h1:eth1", "r1:eth2"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

  - endpoints: ["h2:eth1", "r3:eth2"]
    ipv4: ["192.168.2.10/24", "192.168.2.1/24"]

tests:
  - name: h1_to_h2_ping
    kind: ping
    src: h1
    dst: h2

  - name: h2_to_h1_ping
    kind: ping
    src: h2
    dst: h1

  - name: h1_to_h2_tcp_443_pass
    kind: tcp
    src: h1
    dst: h2
    port: 443
    expect: pass

  - name: h1_to_h2_tcp_22_fail
    kind: tcp
    src: h1
    dst: h2
    port: 22
    expect: fail

scenarios:
  - id: steady_ping_twice
    description: "Run h1->h2 ping twice with an explicit convergence gate"
    steps:
      - run: DOES_NOT_EXIST
      - wait_for:
          type: ping
          from: h1
          to: h2
          expect: pass
          timeout: 30
      - run: h1_to_h2_ping
