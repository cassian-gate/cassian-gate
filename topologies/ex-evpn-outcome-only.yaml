name: ex-evpn-outcome-only

fabric:
  evpn:
    enabled: true
    mode: vlan-aware
    asn: 65100

nodes:
  - name: spine1
    type: frr
    role: spine
    evpn_rr: true
    router_id: 10.255.0.1

  - name: leaf1
    type: frr
    role: leaf
    router_id: 10.255.0.11

  - name: leaf2
    type: frr
    role: leaf
    router_id: 10.255.0.12

  - name: h1
    type: host
    attach: leaf1
    vlan: 10
    ip: 192.168.10.10/24
    gw: 192.168.10.1
    mac: "00:11:22:33:44:55"

  - name: h2
    type: host
    attach: leaf2
    vlan: 10
    ip: 192.168.20.10/24
    gw: 192.168.20.1
    mac: "00:11:22:33:44:66"

links:
  - endpoints: ["spine1:eth1", "leaf1:eth1"]
    ipv4: ["172.16.0.0/31", "172.16.0.1/31"]

  - endpoints: ["spine1:eth2", "leaf2:eth1"]
    ipv4: ["172.16.0.2/31", "172.16.0.3/31"]

  - endpoints: ["h1:eth1", "leaf1:eth2"]

  - endpoints: ["h2:eth1", "leaf2:eth2"]

vlans:
  10:
    vni: 10100

tests:
  - name: spine1_to_leaf1_underlay_ping
    kind: ping
    src: spine1
    to: 172.16.0.1
    expect: pass
    count: 2

  - name: h1_to_h2_ping_multihop_default
    kind: ping
    src: h1
    dst: h2
    expect: fail
    count: 2

  - name: h1_to_h2_tcp_443_multihop_default
    kind: tcp
    src: h1
    dst: h2
    port: 443
    expect: fail

scenarios:
  - id: bounce_spine_leaf1_link
    description: "Outcome-only: bounce spine1<->leaf1 and verify h1->h2 remains reachable after convergence wait"
    steps:
      - run: spine1_to_leaf1_underlay_ping

      - fault:
          link_down:
            a: spine1
            a_if: eth1
            b: leaf1
            b_if: eth1

      - wait_for:
          type: ping
          from: h1
          to: h2
          expect: pass
          timeout: 20
          interval_s: 1.0

      - fault:
          link_up:
            a: spine1
            a_if: eth1
            b: leaf1
            b_if: eth1

      - wait_for:
          type: ping
          from: h1
          to: h2
          expect: pass
          timeout: 30
          interval_s: 1.0

      - run: spine1_to_leaf1_underlay_ping