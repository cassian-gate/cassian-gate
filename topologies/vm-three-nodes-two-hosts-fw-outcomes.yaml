name: vm-three-nodes-two-hosts-fw-outcomes

nodes:
  # Linux nodes are used only as deterministic endpoints for links/ifnames
  # (no routing intent is encoded; v1 truthful expectations use expect: fail).
  - name: r1
    type: linux

  - name: r2
    type: linux

  # VM runtime node (v1.5 foundation contract: sonic-vm only)
  - name: s1
    type: sonic-vm
    runtime: vm
    image: local/sonic-vm:202405

  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: h2
    type: host
    ip: 192.168.2.10/24
    gw: 192.168.2.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 10.0.0.3/31
      eth2: 10.0.0.4/31
      eth3: 10.0.0.7/31
    routes:
      - "192.168.1.0/24 via 10.0.0.2"
      - "192.168.2.0/24 via 10.0.0.5"
    allow_icmp: true
    allow_tcp: [443]

links:
  - endpoints: ["h1:eth1", "r1:eth1"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

  - endpoints: ["r1:eth2", "r2:eth1"]
    ipv4: ["10.0.0.0/31", "10.0.0.1/31"]

  - endpoints: ["r2:eth2", "fw1:eth1"]
    ipv4: ["10.0.0.2/31", "10.0.0.3/31"]

  - endpoints: ["fw1:eth2", "s1:eth1"]
    ipv4: ["10.0.0.4/31", "10.0.0.5/31"]

  - endpoints: ["s1:eth2", "h2:eth1"]
    ipv4: ["192.168.2.1/24", "192.168.2.10/24"]

  # Second parallel link between fw1 and s1 to require explicit disambiguation in link faults.
  - endpoints: ["fw1:eth3", "s1:eth3"]
    ipv4: ["10.0.0.6/31", "10.0.0.7/31"]

tests:
  # Truthful v1 expectation: no routing is inferred/validated; multi-hop reachability is not assumed.
  - name: h1_to_h2_ping
    kind: ping
    src: h1
    src_if: eth1
    dst: h2
    expect: fail
    count: 1

  - name: h1_to_h2_ip_literal_ping
    kind: ping
    src: h1
    to: 192.168.2.10
    expect: fail
    count: 1

  - name: h1_to_h2_to_ip_alias_ping
    kind: ping
    src: h1
    to_ip: 192.168.2.10
    expect: fail
    count: 1

  - name: h1_to_h2_tcp_443
    kind: tcp
    src: h1
    dst: h2
    port: 443
    expect: fail

scenarios:
  - id: vm_bounce_link_fw1_s1_recover
    description: "Bounce the fw1<->s1 primary link (explicit endpoints) and verify h1->h2 remains failed (v1 truthful, no routing auto-config)"
    steps:
      - run: h1_to_h2_ping

      - fault:
          link_down:
            a: fw1
            a_if: eth2
            b: s1
            b_if: eth1

      - wait_for:
          type: ping
          from: h1
          to: 192.168.2.10
          expect: fail
          timeout: 10
          interval_s: 1.0

      - fault:
          link_up:
            a: fw1
            a_if: eth2
            b: s1
            b_if: eth1

      - wait_for:
          type: ping
          from: h1
          to: h2
          expect: fail
          timeout: 10
          interval_s: 1.0

      - run: h1_to_h2_ping

  - id: vm_bounce_interface_s1_eth1_recover
    description: "Bounce s1:eth1 and verify h1->h2 remains failed (v1 truthful, no routing auto-config)"
    steps:
      - run: h1_to_h2_ping

      - fault:
          interface_down:
            node: s1
            if: eth1

      - wait_for:
          type: ping
          from: h1
          to: 192.168.2.10
          expect: fail
          timeout: 10
          interval_s: 1.0

      - fault:
          interface_up:
            node: s1
            if: eth1

      - wait_for:
          type: ping
          from: h1
          to: h2
          expect: fail
          timeout: 10
          interval_s: 1.0

      - run: h1_to_h2_ping

