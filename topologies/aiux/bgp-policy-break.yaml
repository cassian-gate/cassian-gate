name: aiux-bgp-policy-break

nodes:
  - name: r1
    type: frr
  - name: r2
    type: frr
  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1
  - name: h2
    type: host
    ip: 192.168.2.10/24
    gw: 192.168.2.1

links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.0.0.0/31", "10.0.0.1/31"]
  - endpoints: ["h1:eth1", "r1:eth2"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]
  - endpoints: ["h2:eth1", "r2:eth2"]
    ipv4: ["192.168.2.10/24", "192.168.2.1/24"]

tests:
  - name: h1_to_h2_ping
    kind: ping
    src: h1
    dst: h2
    expect: pass

