name: sonic-grey-failure

# §4.5-d VM-8 -- scope §9 row 14 (REQ-45D-22): the grey-failure fixture, shaped like row 15's
# (founder ruling S37-R5 of 2026-10-20; its waiting step amended forward by S37-R6, its
# detection clause by S37-R14 of 2026-10-22). One fixture, one boot: r1 (frr) and s1
# (sonic-vm) with one declared eBGP session over r1:eth1 -- s1:eth1.
#
# RUN ONLY THROUGH tests/sonic_grey_failure_proof.py, which runs, on the same boot and in row
# 15's pattern, the control and then the scenario S37-R5 sets out:
#   the control   `cassian test sonic-grey-failure --name grey_session_up`: the declared
#                 invariant passes before the fault (handover §15.2's -22 negative)
#   the scenario  `cassian test sonic-grey-failure --scenario grey_packet_loss` (without
#                 --scenario, `cassian test` runs the declared tests, not the scenario). Its run
#                 step is MEANT to fail on a healthy lab, so the scenario reports a failure by
#                 design.
#     step 1  packet_loss 100       the existing engine's fault on s1:eth1, applied to the
#                                   vrnetlab launcher's eth1, which carries what the guest sends
#     step 2  wait 270 s            N (S37-R6): the negotiated hold time read on s1 in the
#                                   pre-run, 180 s on sonic-vm:202405, plus a 90 s margin; the
#                                   proof refuses unless the live hold time is below N
#     step 3  run grey_session_up   the detection: expect pass, observed fail
#
# Declaration surface is FRR's, key for key (REQ-45C-23), as in sonic-bgp-session-live.yaml.
# No node declares networks: the detection reads the session, not a route.
#
# HALT-2 address discipline (founder ruling 2026-08-15, surface S-9): every address is RFC 5737,
# outside the stock canned ranges 10.0.0.0/26 and 10.1.0.0/24, and unused by every other fixture
# in topologies/ when chosen (192.0.2.141, .142; 198.51.100.76, .77). ASNs avoid 65100, the stock
# DEVICE_METADATA bgp_asn.
#
# REGISTERED in SECTION_45C_FIXTURES (tests/sonic_lifecycle_proof.py) in the SAME commit that
# adds this file (founder ruling S27-R5).
#
# ONE sonic-vm guest, inside the single-SONiC-node ceiling. Image resolves from the
# contrib-owned local tag (REQ-45C-11, REQ-45C-32); no registry pull.

nodes:
  - name: r1
    type: frr
    asn: 65141
    router_id: 192.0.2.141
    bgp:
      neighbors:
        - peer: s1
          remote_as: 65142

  - name: s1
    type: sonic-vm
    runtime: vm
    image: local/sonic-vm:202405
    asn: 65142
    router_id: 192.0.2.142
    bgp:
      neighbors:
        - peer: r1
          remote_as: 65141

links:
  - endpoints: ["r1:eth1", "s1:eth1"]
    ipv4: ["198.51.100.76/31", "198.51.100.77/31"]

tests:
  # REQ-45D-22: run by name before the fault (the control) and by the scenario after the wait
  # (the detection). One read each: the retries timeout_s allows are for a read that fails, not
  # for a session that is not Established.
  - name: grey_session_up
    kind: invariant
    type: bgp_session_up
    node: s1
    neighbor: 198.51.100.76
    expect: pass
    timeout_s: 60

scenarios:
  - id: grey_packet_loss
    description: "REQ-45D-22: 100% loss on s1:eth1 (netem on the launcher), detected by bgp_session_up on s1 after the hold time"
    steps:
      - fault:
          packet_loss:
            node: s1
            if: eth1
            loss: 100
      - wait:
          seconds: 270
      - run: grey_session_up
