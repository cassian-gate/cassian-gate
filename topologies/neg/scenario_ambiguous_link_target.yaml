name: scenario-ambiguous-link-target

nodes:
  - name: r1
    type: frr

  - name: r2
    type: frr

  - name: r3
    type: frr

  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: h2
    type: host
    ip: 192.168.2.10/24
    gw: 192.168.2.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 10.0.0.3/31
      eth2: 10.0.0.4/31
      eth3: 10.0.0.7/31
    routes:
      - "192.168.1.0/24 via 10.0.0.2"
      - "192.168.2.0/24 via 10.0.0.5"
    allow_icmp: true
    allow_tcp: [443]

links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.0.0.0/31", "10.0.0.1/31"]

  - endpoints: ["r2:eth2", "fw1:eth1"]
    ipv4: ["10.0.0.2/31", "10.0.0.3/31"]

  - endpoints: ["fw1:eth2", "r3:eth1"]
    ipv4: ["10.0.0.4/31", "10.0.0.5/31"]

  - endpoints: ["h1:eth1", "r1:eth2"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

  - endpoints: ["h2:eth1", "r3:eth2"]
    ipv4: ["192.168.2.10/24", "192.168.2.1/24"]

  - endpoints: ["r2:eth3", "fw1:eth3"]
    ipv4: ["10.0.0.6/31", "10.0.0.7/31"]

tests:
  - name: h1_to_h2_ping
    kind: ping
    src: h1
    dst: h2
    expect: fail
    count: 1

scenarios:
  - id: ambiguous_link_fault
    steps:
      - fault:
          link_down:
            a: r2
            b: fw1
