name: bgp-invalid-med-invariant
nodes:
  - name: r1
    type: frr
    asn: 65001
    router_id: 1.1.1.1
    bgp:
      neighbors:
        - peer: r2
          remote_as: 65002
  - name: r2
    type: frr
    asn: 65002
    router_id: 2.2.2.2
    bgp:
      neighbors:
        - peer: r1
          remote_as: 65001
links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.0.0.1/30", "10.0.0.2/30"]
tests:
  - name: invalid_bgp_med_missing_expected_med
    kind: invariant
    type: bgp_med_equals
    node: r2
    peer: r1
    prefix: 1.1.1.1/32
    expect: pass
