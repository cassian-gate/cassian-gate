tests:
  # PROOF-8 — single invariant exercising R06 truncation + R28 marker.
  # 50 declared host MACs survive the WI-1 Patch 4 D06 filter and dedup-
  # double in evidence_entries; observed_state.evpn_routes ~100 entries
  # ~9500 bytes -> exceeds 8192 ceiling -> finalizer truncates ->
  # observed_state_truncated=true -> summary emits R28 marker line.
  - name: leaf2_evpn_mac_route_for_unknown_mac
    kind: invariant
    type: evpn_mac_route_present
    node: leaf2
    mac: "de:ad:be:ef:00:01"
    vni: 10100
    expect: pass