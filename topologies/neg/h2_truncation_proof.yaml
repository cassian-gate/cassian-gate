name: h2-truncation-proof

# -----------------------------------------------------------------------------
# Phase 1a — Handover 2 of 8: Invariant Failure Observability
# Synthetic large-payload truncation fixture (R06, R28; PROOF-8).
#
# Purpose
#   Exercise the WI-1 Patch 1 finalizer's deterministic suffix-drop
#   truncation discipline (R06) and the WI-2 R28 truncation-marker
#   rendering. Each declared host MAC survives the WI-1 Patch 4 D06
#   filter and dedup-doubles in evidence_entries, so 50 declared host
#   MACs produce ~100 entries -> ~9500 bytes serialized observed_state
#   -> exceeds the 8192-byte ceiling -> finalizer truncates ->
#   observed_state_truncated becomes true -> summary renderer emits the
#   literal trailing line '(observed_state truncated; full payload in
#   results.json)' at 6-space indent.
#
# Substrate
#   Same shape as h2_invariant_observability_demo (1 spine RR + 2
#   leaves) scaled up with 50 declared hosts (25 per leaf) carrying
#   unique deterministic MAC + IP fields.
#
# Invariant exercised (R33 not applicable here; this fixture is
# scoped to PROOF-8 only)
#   evpn_mac_route_present node=leaf2 mac=de:ad:be:ef:00:01 vni=10100
#   expect=pass -> fails by design because de:ad:be:ef:00:01 is not in
#   the 50 declared host MACs.
#
# This topology is verification scaffolding only. It is not part of
# the product surface and is not consumed by any other workstream.
# -----------------------------------------------------------------------------

