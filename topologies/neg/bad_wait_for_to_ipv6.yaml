name: bad-waitfor-to-ipv6

nodes:
  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: r1
    type: frr

links: []

scenarios:
  - id: s1
    description: "wait_for ping: IPv6 must be rejected in v1.x (IPv4-only here)"
    steps:
      - wait_for:
          type: ping
          from: h1
          to: 2001:db8::1
          expect: pass
