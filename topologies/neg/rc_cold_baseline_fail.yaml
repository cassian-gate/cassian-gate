# topologies/rc_cold_baseline.yaml
name: rc-cold-baseline

nodes:
  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: h2
    type: host
    ip: 192.168.2.10/24
    gw: 192.168.2.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 192.168.1.1/24
      eth2: 192.168.2.1/24
    allow_icmp: true
    allow_tcp: []

links:
  - endpoints: ["h1:eth1", "fw1:eth1"]
  - endpoints: ["h2:eth1", "fw1:eth2"]

tests:
  # PASS cases: allowed port 8443
  - name: h1_tcp_8443_to_h2_pass
    kind: tcp
    src: h1
    dst: h2
    port: 8443
    listener: true
    expect: pass

  - name: h2_tcp_8443_to_h1_pass
    kind: tcp
    src: h2
    dst: h1
    port: 8443
    listener: true
    expect: pass

  # FAIL cases: blocked port 2222 (unprivileged)
  - name: h1_tcp_2222_to_h2_fail
    kind: tcp
    src: h1
    dst: h2
    port: 2222
    listener: true
    expect: fail

  - name: h2_tcp_2222_to_h1_fail
    kind: tcp
    src: h2
    dst: h1
    port: 2222
    listener: true
    expect: fail