name: blast-radius-ambiguous-fault-target

nodes:
  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: h2
    type: host
    ip: 192.168.2.10/24
    gw: 192.168.2.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 192.168.1.1/24
      eth2: 192.168.2.1/24
    allow_icmp: true

links:
  - endpoints: ["h1:eth1", "fw1:eth1"]
  - endpoints: ["h2:eth1", "fw1:eth2"]

tests:
  - name: h1_to_fw1_ping_pass
    kind: ping
    src: h1
    dst: fw1
    expect: pass
    count: 1

scenarios:
  - id: ambiguous_fault_target
    steps:
      - fault:
          packet_loss:
            node: h1
            if: eth1
            a: h1
            a_if: eth1
            b: fw1
            b_if: eth1
            loss: 5
