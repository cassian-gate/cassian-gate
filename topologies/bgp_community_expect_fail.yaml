name: bgp-community-expect-fail
# §4.10 deployable expect-fail fixture (REQ-BGPCOM-CATALOG-1 deployable catalog;
# §4.5 P-EXPF-COV). r1 originates its loopback 1.1.1.1/32; r2 applies an inbound
# route-map that sets communities on the received route. Two expect: fail tests
# cover the two expect-fail quadrants (Q3 / Q4) for bgp_community.
nodes:
  - name: r1
    type: frr
    asn: 65001
    router_id: 1.1.1.1
    networks:
      - 1.1.1.1/32
    bgp:
      neighbors:
        - peer: r2
          remote_as: 65002
  - name: r2
    type: frr
    asn: 65002
    router_id: 2.2.2.2
    bgp:
      neighbors:
        - peer: r1
          remote_as: 65001
          ipv4_unicast:
            route_map_in: SET-COMM
      route_maps:
        - name: SET-COMM
          entries:
            - seq: 10
              action: permit
              set:
                community:
                  - "65000:100"
                  - no-export
links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.0.0.0/31", "10.0.0.1/31"]
tests:
  # Q4 (holding predicate -> verdict: fail): observed communities contain 65000:100
  # (observed: pass); expect: fail -> the expected failure did not occur.
  - name: q4_community_present_but_expect_fail
    kind: invariant
    type: bgp_community
    node: r2
    prefix: 1.1.1.1/32
    expected: "65000:100"
    expect: fail
  # Q3 (failing predicate -> verdict: pass): observed communities do NOT contain
  # 65999:1 (observed: fail); expect: fail -> the expected failure occurred.
  - name: q3_community_absent_mismatch_expect_fail
    kind: invariant
    type: bgp_community
    node: r2
    prefix: 1.1.1.1/32
    expected: "65999:1"
    expect: fail
