name: route-absent-expect-fail

nodes:
  - name: r1
    type: frr
  - name: r2
    type: frr

links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.10.10.1/24", "10.10.10.2/24"]

tests:
  # Q3 (failing predicate -> verdict: pass): 10.10.10.0/24 is present, so "absent" does not
  # hold (observed: fail); expect: fail -> the expected failure occurred.
  - name: q3_route_absent_10_10_10_0_24_present_expect_fail
    kind: invariant
    type: route_absent
    node: r1
    prefix: 10.10.10.0/24
    expect: fail
  # Q4 (holding predicate -> verdict: fail): 10.20.20.0/24 is absent, so "absent" holds
  # (observed: pass); expect: fail -> the expected failure did not occur.
  - name: q4_route_absent_10_20_20_0_24_absent_but_expect_fail
    kind: invariant
    type: route_absent
    node: r1
    prefix: 10.20.20.0/24
    expect: fail
