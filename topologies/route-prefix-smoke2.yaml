name: route-prefix-smoke2

nodes:
  - name: r1
    type: frr

  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

links:
  - endpoints: ["h1:eth1", "r1:eth1"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

tests:
  - name: r1_has_192_168_1_0_24
    kind: route_prefix
    src: r1
    prefix: 192.168.1.0/24
    expect: pass

  - name: r1_missing_192_168_2_0_24
    kind: route_prefix
    src: r1
    prefix: 192.168.2.0/24
    expect: fail
