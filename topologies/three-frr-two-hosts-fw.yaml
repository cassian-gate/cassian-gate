name: three-frr-two-hosts-fw

nodes:
  - name: r1
    type: frr

  - name: r2
    type: frr

  - name: r3
    type: frr

  - name: fw1
    type: nft-fw
    allow_icmp: true
    allow_tcp: [443]
    allow_udp: []

  - name: h1
    type: host

  - name: h2
    type: host

links:
  # Router chain with firewall inserted between r2 and r3
  - endpoints: ["r1:eth1", "r2:eth1"]
  - endpoints: ["r2:eth2", "fw1:eth1"]
  - endpoints: ["fw1:eth2", "r3:eth1"]

  # Host access links (explicit IPs)
  - endpoints: ["h1:eth1", "r1:eth2"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

  - endpoints: ["h2:eth1", "r3:eth2"]
    ipv4: ["192.168.2.10/24", "192.168.2.1/24"]
