name: route-prefix-waitfor-smoke

nodes:
  - name: r1
    type: frr

  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

links:
  - endpoints: ["h1:eth1", "r1:eth1"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

tests:
  - name: r1_has_192_168_1_0_24
    kind: route_prefix
    src: r1
    prefix: 192.168.1.0/24
    expect: pass

scenarios:
  - id: rp_waitfor_smoke
    description: "Scenario bounded checks for route_prefix (pass + fail) using wait_for"
    steps:
      - wait_for:
          type: route_prefix
          from: h1
          src: r1
          prefix: 192.168.1.0/24
          expect: pass
          timeout: 5
          interval_s: 1.0
          per_attempt_timeout_s: 1

      - wait_for:
          type: route_prefix
          from: h1
          src: r1
          prefix: 192.168.2.0/24
          expect: fail
          timeout: 5
          interval_s: 1.0
          per_attempt_timeout_s: 1

