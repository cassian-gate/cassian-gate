name: rw-bgp-tenant30-change2

nodes:
  - name: leaf1
    type: frr
  - name: leaf2
    type: frr
  - name: h10
    type: host
    ip: 192.168.10.10/24
    gw: 192.168.10.1
  - name: h20
    type: host
    ip: 192.168.20.10/24
    gw: 192.168.20.1
  - name: h30
    type: host
    ip: 192.168.30.10/24
    gw: 192.168.30.1

links:
  - endpoints: ["leaf1:eth1", "leaf2:eth1"]
    ipv4: ["10.0.0.0/31", "10.0.0.1/31"]
  - endpoints: ["h10:eth1", "leaf1:eth2"]
    ipv4: ["192.168.10.10/24", "192.168.10.1/24"]
  - endpoints: ["h20:eth1", "leaf2:eth2"]
    ipv4: ["192.168.20.10/24", "192.168.20.1/24"]
  - endpoints: ["h30:eth1", "leaf1:eth3"]
    ipv4: ["192.168.30.10/24", "192.168.30.1/24"]

tests:
  - name: h10_to_leaf1_gw_ping
    kind: ping
    src: h10
    to: 192.168.10.1
    expect: pass
    count: 1

  - name: h20_to_leaf2_gw_ping
    kind: ping
    src: h20
    to: 192.168.20.1
    expect: pass
    count: 1

  - name: h30_to_leaf1_t30_gw_ping
    kind: ping
    src: h30
    to: 192.168.30.1
    expect: pass
    count: 1

  - name: h10_to_h20_declared_fail
    kind: ping
    src: h10
    to: 192.168.20.10
    expect: fail
    count: 1

  - name: h20_to_h30_declared_fail
    kind: ping
    src: h20
    to: 192.168.30.10
    expect: fail
    count: 1

scenarios:
  - id: prove_change_after_apply
    description: "After applying CHANGE candidate, tenant30 must be reachable from h20."
    steps:
      - run:
          include: all

      - wait_for:
          type: ping
          from: h10
          to: 192.168.20.10
          expect: pass
          timeout: 30
          interval_s: 1.0
          count: 2
          per_attempt_timeout_s: 2

      - wait_for:
          type: ping
          from: h20
          to: 192.168.30.10
          expect: pass
          timeout: 30
          interval_s: 1.0
          count: 2
          per_attempt_timeout_s: 2

