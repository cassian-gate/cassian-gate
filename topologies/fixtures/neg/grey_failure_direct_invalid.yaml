name: grey-failure-direct-invalid

nodes:
  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1
  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 192.168.1.1/24
    allow_icmp: true

links:
  - endpoints: ["h1:eth1", "fw1:eth1"]

tests:
  - name: h1_to_fw1_ping
    kind: ping
    src: h1
    dst: fw1
    expect: pass
    count: 1

scenarios:
  - id: invalid_loss
    steps:
      - fault:
          packet_loss:
            node: h1
            if: eth1
            loss: 200
      - run: h1_to_fw1_ping
