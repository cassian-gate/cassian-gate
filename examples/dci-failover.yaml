name: dci-failover

nodes:
  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 192.168.1.1/24

links:
  - endpoints: ["h1:eth1", "fw1:eth1"]
    ipv4: ["192.168.1.10/24", "192.168.1.1/24"]

tests:
  - name: h1_to_fw1_ping_pass
    kind: ping
    src: h1
    dst: fw1
    expect: pass
    count: 1

scenarios:
  - id: fw_bounce_interface_recover
    description: "Bounce fw1:eth1 and verify ping fails during outage then recovers deterministically"
    steps:
      - run: h1_to_fw1_ping_pass

      - fault:
          interface_down:
            node: fw1
            if: eth1

      - wait_for:
          type: ping
          from: h1
          to: 192.168.1.1
          expect: fail
          timeout: 10
          interval_s: 1.0

      - fault:
          interface_up:
            node: fw1
            if: eth1

      - wait_for:
          type: ping
          from: h1
          to: 192.168.1.1
          expect: pass
          timeout: 10
          interval_s: 1.0

      - run: h1_to_fw1_ping_pass