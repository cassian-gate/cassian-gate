schema_version: "1"
name: ex02-bgp-multihop-tcp

nodes:
  - name: r1
    type: frr
    frr_mode: preconfigured
    image: ghcr.io/andrew-ai-netsim/ai-netsim/frr-demo-bgp-r1:v1x

  - name: r2
    type: frr
    frr_mode: preconfigured
    image: ghcr.io/andrew-ai-netsim/ai-netsim/frr-demo-bgp-r2:v1x

  - name: h1
    type: host

  - name: h2
    type: host

links:
  - endpoints: ["r1:eth1", "r2:eth1"]
    ipv4: ["10.0.12.0/31", "10.0.12.1/31"]

  - endpoints: ["r1:eth2", "h1:eth1"]
    ipv4: ["10.10.1.1/24", "10.10.1.2/24"]

  - endpoints: ["r2:eth2", "h2:eth1"]
    ipv4: ["10.10.2.1/24", "10.10.2.2/24"]

tests:
  # Control-plane invariant (preconfigured BGP must be Established)
  - name: bgp_r1_to_r2_up
    kind: bgp_neighbor
    src: r1
    dst: 10.0.12.1
    expect: pass
    timeout_s: 20
    retry_interval_s: 1.0

  - name: bgp_r2_to_r1_up
    kind: bgp_neighbor
    src: r2
    dst: 10.0.12.0
    expect: pass
    timeout_s: 20
    retry_interval_s: 1.0

  # Data-plane proof
  - name: tcp_h1_to_h2_should_pass
    type: tcp
    src: h1
    dst: h2
    port: 8080
    listener: true
    expect: pass

scenarios:
  - id: bgp_neighbor_smoke
    description: "BGP neighbor Established on both sides"
    steps:
      - run: bgp_r1_to_r2_up
      - run: bgp_r2_to_r1_up
