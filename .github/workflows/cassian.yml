name: Cassian Gate (authoritative gate)

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: read

jobs:
  gate:
    name: cassian test (deterministic gate)
    # NOTE:
    # - containerlab requires privileged Docker networking / netns access.
    # - GitHub-hosted runners often cannot support this reliably.
    # - This workflow is intended for self-hosted runners (recommended for OSS).
    runs-on: self-hosted

    env:
      PYTHONUNBUFFERED: "1"
      # Deterministic: ensure local src/ imports are used.
      PYTHONPATH: "src"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # C1 (LD-UN-1) ruled Option B for the name-resolution guard: it runs
      # the 3.10/3.11/3.12 matrix. This step provisions the two extra
      # interpreters and runs BEFORE the pinned setup, so `python` still
      # resolves to 3.11 for every other step. NG-4 -- the gate-wide matrix
      # and requires-python policy -- is NOT decided here.
      - name: Setup Python (guard matrix - 3.10, 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.12

      - name: Setup Python (pinned)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Docker ==="
          docker version
          echo
          echo "=== containerlab ==="
          if command -v containerlab >/dev/null 2>&1; then
            containerlab version
          else
            echo "ERROR: containerlab not found on runner."
            echo "This workflow requires a runner with containerlab preinstalled (pinned) and Docker privileges."
            exit 2
          fi

      - name: Install Python dependencies (deterministic)
        shell: bash
        run: |
          set -euo pipefail
          python -V
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install .
          fi

      - name: Syntax sanity (fast)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/*.py

      - name: Name-resolution class-closure guard (undefined-name remediation)
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for v in 3.10 3.11 3.12; do
            command -v "python$v" >/dev/null 2>&1 || missing="$missing python$v"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: guard interpreter matrix incomplete; missing:$missing"
            echo "C1 (LD-UN-1) ruled Option B. Provisioning the runner is in"
            echo "scope for a runner-setup step; anything beyond that is a HALT"
            echo "to the founder, never a fall back to single-version."
            exit 2
          fi
          for v in 3.10 3.11 3.12; do
            echo "=== python$v selftest (REQ-UNDEF-13 non-vacuity) ==="
            "python$v" tests/name_resolution_guard.py --selftest
            echo "=== python$v gate (REQ-UNDEF-12) ==="
            "python$v" tests/name_resolution_guard.py
          done
          echo "=== replay determinism (DS-1; MS amendment A1) ==="
          python3.11 tests/name_resolution_guard.py > "$RUNNER_TEMP/nrg1.txt"
          python3.11 tests/name_resolution_guard.py > "$RUNNER_TEMP/nrg2.txt"
          diff "$RUNNER_TEMP/nrg1.txt" "$RUNNER_TEMP/nrg2.txt"
          echo "replay: byte-identical"

      - name: Observed-state absence-render proof harness (§4.1)
        shell: bash
        run: |
          set -euo pipefail
          python tests/bl6_observed_state_absence_render_proof.py

      - name: Renderer regression proof harness (§4.3)
        shell: bash
        run: |
          set -euo pipefail
          python tests/bl_h3_8_scenarios_summary_existing_type_render_proof.py

      - name: Engine validation hardening proof harnesses (§4.4)
        shell: bash
        run: |
          set -euo pipefail
          python tests/h53_resolve_interface_existence_proof.py
          python tests/h57_scenario_invariant_dispatch_generalization_proof.py

      - name: NOS provider structure proof harnesses (§4.5-b)
        shell: bash
        run: |
          set -euo pipefail
          python tests/nos_leaf_import_proof.py
          python tests/nos_deny_by_default_proof.py
          python tests/nos_census_instrument.py

      - name: SONiC base lifecycle proof harnesses (§4.5-c)
        shell: bash
        run: |
          set -euo pipefail
          python tests/sonic_leaf_import_proof.py
          python tests/sonic_configgen_determinism_proof.py
          python tests/sonic_provision_supply_proof.py
          python tests/sonic_image_lifecycle_proof.py
          python tests/sonic_lifecycle_proof.py
          python tests/sonic_routing_mode_precondition_proof.py
          python tests/sonic_status_probe_sequence_proof.py
          python tests/wheel_import_proof.py
          python tests/reconfigure_clean_state_proof.py
          python tests/sonic_provision_readiness_gate_proof.py
          python tests/sonic_nos_ready_proof.py
          # §4.5-c WI-1 packet 2 C2, entry 1 of 3 (LD-45C-R30 R2). No argv =
          # LEGs 1-9, lab-free, byte-identical to what packet 1 landed. The
          # file's two (VM) arms take their own steps below; LD-45C-R27 R1's
          # "single CI entry" is one EDIT OCCASION, not one step (R30 §5).
          python tests/sonic_preconfigured_proof.py

      - name: cmd evidence derivation differential (§4.5-c WI-8, REQ-45C-36)
        shell: bash
        run: |
          set -euo pipefail
          python tests/cmd_evidence_derivation_differential_proof.py

      - name: unsupported-capability disposition (§4.5-c BL-P2-4.5c-44)
        shell: bash
        run: |
          set -euo pipefail
          python tests/sonic_unsupported_capability_disposition_proof.py

      - name: User-defined invariant (exec) proof harnesses (§4.7)
        shell: bash
        run: |
          set -euo pipefail
          python tests/udi_validate_rejection_proof.py
          python tests/udi_guardrail_uniformity_proof.py
          python tests/udi_dispatch_parity_proof.py
          python tests/udi_assertion_eval_proof.py
          python tests/udi_four_quadrant_proof.py
          python tests/udi_replay_determinism_proof.py
          python tests/udi_render_boundary_proof.py
          python tests/udi_blast_radius_coverage_proof.py
          python tests/udi_preservation_proof.py

      - name: Test tags + selective execution proof harnesses (§4.8)
        shell: bash
        run: |
          set -euo pipefail
          python tests/tag_validate_rejection_proof.py
          python tests/tag_selector_proof.py
          python tests/tag_nonexec_schema_proof.py
          python tests/tag_authority_parity_proof.py
          python tests/tag_schema_invariance_proof.py
          python tests/tag_replay_determinism_proof.py
          python tests/tag_nonexec_render_boundary_proof.py
          python tests/tag_preservation_proof.py

      - name: AI-change canonical reference case proof harness (§4.9)
        shell: bash
        run: |
          set -euo pipefail
          python tests/ai_change_reference_case_proof.py

      - name: BGP community matching proof harnesses (§4.10)
        shell: bash
        run: |
          set -euo pipefail
          python tests/bgp_community_validate_rejection_proof.py
          python tests/bgp_community_catalog_coherence_proof.py
          python tests/bgp_community_set_gen_proof.py
          python tests/bgp_community_eval_match_proof.py
          python tests/bgp_community_four_quadrant_proof.py
          python tests/bgp_community_authority_parity_proof.py
          python tests/bgp_community_replay_determinism_proof.py
          python tests/bgp_community_render_boundary_proof.py
          python tests/bgp_community_preservation_proof.py
          python tests/expf_four_quadrant_catalog_proof.py

      - name: BGP AS-path validation proof harnesses (§4.11)
        shell: bash
        run: |
          set -euo pipefail
          python tests/bgp_as_path_validate_rejection_proof.py
          python tests/bgp_as_path_catalog_coherence_proof.py
          python tests/bgp_as_path_eval_match_proof.py
          python tests/bgp_as_path_four_quadrant_proof.py
          python tests/bgp_as_path_authority_parity_proof.py
          python tests/bgp_as_path_replay_determinism_proof.py
          python tests/bgp_as_path_render_boundary_proof.py
          python tests/bgp_as_path_preservation_proof.py

      - name: P3 hardening cluster proof harnesses (§4.12)
        shell: bash
        run: |
          set -euo pipefail
          python tests/b6_pass_scope_render_proof.py
          python tests/b6_13bc_seam_preservation_proof.py
          python tests/h54_doctor_ip_j_probe_proof.py
          python tests/wf_12_13_replay_proof.py

      - name: Audit-grade evidence artifact format proof harnesses (§4.13)
        shell: bash
        run: |
          set -euo pipefail
          python tests/audit_evidence_schema_format_proof.py
          python tests/audit_tamper_check_replay_proof.py
          python tests/audit_release_version_determinism_proof.py
          python tests/audit_baseline_diff_determinism_proof.py
          python tests/audit_intent_input_sufficiency_proof.py
          python tests/audit_intent_verdict_invariance_proof.py
          python tests/audit_self_contained_interpretation_proof.py
          python tests/audit_unverifiable_render_boundary_proof.py
          python tests/audit_seam_preservation_proof.py
          python tests/audit_nonscoped_preservation_proof.py

      - name: Brownfield importer proof harnesses (§4.14)
        shell: bash
        run: |
          set -euo pipefail
          python tests/importer/importer_behavior_proof.py
          python tests/importer/backend_seam_proof.py
          python tests/importer/preservation_proof.py

      - name: Two-run behavioural-equivalence proof harnesses (Phase 2 4.4)
        shell: bash
        run: |
          set -euo pipefail
          python tests/two_run_injected_difference_proof.py
          python tests/two_run_verdict_substitution_proof.py
          python tests/two_run_config_vs_behaviour_proof.py
          python tests/two_run_canonical_serialization_proof.py

      - name: VM-runtime exec-into gate proof harness (R-O1 remediation)
        shell: bash
        run: |
          set -euo pipefail
          python tests/vm_runtime_validate_rejection_proof.py

      - name: Project gate (up -> test -> down)
        shell: bash
        run: |
          set -euo pipefail
          ./src/cassian.py up topologies/three-frr-two-hosts-fw-routed.yaml --reconfigure
          ./src/cassian.py test three-frr-two-hosts-fw-routed --scenario quick_all
          ./src/cassian.py down three-frr-two-hosts-fw-routed

      - name: B-9 observed_state render determinism (replay byte-identity)
        shell: bash
        run: |
          set -euo pipefail
          TOPO=topologies/neg/h2_invariant_observability_demo.yaml
          LAB=h2-invariant-observability-demo
          SUM="labs/clab-${LAB}/results.summary.txt"
          # By-design failing-invariant topology, run twice from clean state.
          # Verdict is FAIL by design (|| true); B-9 asserts byte-identity of the
          # rendered observed_state surface (results.summary.txt) across replay,
          # not the verdict. The H2 D06 filter keeps env-variant tokens out.
          ./src/cassian.py up "$TOPO" --reconfigure
          ./src/cassian.py test "$LAB" || true
          cp "$SUM" /tmp/bl6_b9_run1.summary.txt
          ./src/cassian.py down "$LAB"
          ./src/cassian.py up "$TOPO" --reconfigure
          ./src/cassian.py test "$LAB" || true
          cp "$SUM" /tmp/bl6_b9_run2.summary.txt
          ./src/cassian.py down "$LAB"
          if ! diff -u /tmp/bl6_b9_run1.summary.txt /tmp/bl6_b9_run2.summary.txt; then
            echo "ERROR: B-9 observed_state render differs across replay (non-deterministic)."
            exit 1
          fi
          echo "B-9 OK: observed_state render byte-identical across replay."

      - name: EVPN collection migration differential (§4.5-c WI-7, REQ-45C-14)
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/wi7-postside
          rm -rf "$OUT"; mkdir -p "$OUT"
          # Two of the three topologies are by-design authoritative FAILs
          # (Doctrine §1.8: negative outcomes are first-class), so the verdict
          # is carried by || true and the proof asserts the ARTIFACT, the way
          # the B-9 step above asserts the rendered surface rather than the
          # exit code. results.json absent => the proof hard-fails on it.
          for PAIR in \
            "topologies/evpn_mac_route_present.yaml|evpn-mac-route-present" \
            "topologies/evpn_mac_route_absent_expected_present.yaml|evpn-mac-route-absent-expected-present" \
            "topologies/evpn_mac_route_absent_expect_fail.yaml|evpn-mac-route-absent-expect-fail" ; do
            TOPO="${PAIR%%|*}"; LAB="${PAIR##*|}"
            ./src/cassian.py up "$TOPO" --reconfigure
            ./src/cassian.py test "$TOPO" || true
            cp "labs/clab-${LAB}/results.json" "$OUT/${LAB}.results.json"
            ./src/cassian.py down "$LAB"
          done
          # --artifacts discharges §15.2 row 1 as well as rows 2-4. A missing
          # artifact is a hard fail inside the proof, never a silent skip.
          python tests/evpn_collection_migration_proof.py --artifacts "$OUT"

      - name: Two-run baseline_diff real-run positive + replay (Phase 2 4.4, REQ-44-5)
        shell: bash
        run: |
          set -euo pipefail
          T=topologies/rw-bgp-tenant30-change.yaml
          C=tests/fixtures/rw-bgp-tenant30-change/
          B=topologies/rw-bgp-tenant30-baseline.yaml
          BUNDLE=labs/clab-rw-bgp-tenant30-change/two_run
          # two-run's own exit reflects the CHANGE verdict; baseline_diff is written regardless (|| true).
          # Replay leg mirrors B-9: run twice, assert byte-identical baseline_diff across real runs.
          ./src/cassian.py test --two-run --two-run-topology "$T" --candidate-config "$C" "$B" || true
          cp -r "$BUNDLE" /tmp/two_run_gate_run1
          ./src/cassian.py test --two-run --two-run-topology "$T" --candidate-config "$C" "$B" || true
          python tests/two_run_real_run_positive_proof.py /tmp/two_run_gate_run1 "$BUNDLE"

      - name: Log in to ghcr.io (private CI image; O-4 GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: VM-runtime assertion leg — validate/up/test/down (§4.5-a, REQ-45a-5)
        shell: bash
        run: |
          set -euo pipefail
          # Image resolves from the contrib-owned local tag (REQ-45C-11); no registry
          # pull. A missing image fails at up/ with the REQ-45C-31 (a)/(b)/(c) error.
          ./src/cassian.py validate topologies/vm-assertion-smoke.yaml
          ./src/cassian.py up topologies/vm-assertion-smoke.yaml --reconfigure
          ./src/cassian.py test vm-assertion-smoke
          ./src/cassian.py down vm-assertion-smoke

      - name: SONiC endpoint recognition — mixed host/linux (§4.5-c WI-2, REQ-45C-6/-7)
        shell: bash
        run: |
          set -euo pipefail
          # (VM) proof per §15.2. Artifacts are copied aside BEFORE `down`,
          # following tests/two_run_real_run_positive_proof.py's shape earlier
          # in this workflow — the proof must not depend on what `down` leaves.
          rm -rf /tmp/wi2_host /tmp/wi2_linux

          ./src/cassian.py validate topologies/sonic-mixed-host.yaml
          ./src/cassian.py up topologies/sonic-mixed-host.yaml --reconfigure
          ./src/cassian.py test sonic-mixed-host
          cp -r labs/clab-sonic-mixed-host /tmp/wi2_host
          ./src/cassian.py down sonic-mixed-host

          ./src/cassian.py validate topologies/sonic-mixed-linux.yaml
          ./src/cassian.py up topologies/sonic-mixed-linux.yaml --reconfigure
          ./src/cassian.py test sonic-mixed-linux
          cp -r labs/clab-sonic-mixed-linux /tmp/wi2_linux
          ./src/cassian.py down sonic-mixed-linux

          python tests/sonic_endpoint_recognition_proof.py /tmp/wi2_host /tmp/wi2_linux

      # === §4.5-c WI-3 packet 4b-iii — (VM) legs ==========================
      # Four cycles, no sharing (founder ruling 2026-08-26): each requirement
      # gets its own fixture and its own up/test/down, so no leg's evidence
      # depends on another leg's fixture. `if: success() || failure()` on every
      # step per BL-P2-4.5c-62 — a skipped step is neither pass nor fail, it is
      # no evidence (Doctrine §1.11).

      # --- Cycle A: converging pair. Proofs run BETWEEN up and down: these are
      # live-device reads through the product's runtime seam (LD-45C-R1).
      - name: SONiC precheck (VM) — converging pair, REQ-45C-8 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ./src/cassian.py up topologies/probe-sonic-bgp-pair.yaml --reconfigure
          ./src/cassian.py test probe-sonic-bgp-pair
          python tests/sonic_precheck_proof.py req8 \
            topologies/probe-sonic-bgp-pair.yaml probe-sonic-bgp-pair

      - name: SONiC rendering-to-acceptance (VM) — REQ-45C-22 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python tests/sonic_lifecycle_proof.py req22 \
            topologies/probe-sonic-bgp-pair.yaml probe-sonic-bgp-pair
          ./src/cassian.py down probe-sonic-bgp-pair

      # --- Cycle B: asymmetric declaration. `test` is EXPECTED to fail — the
      # far node's expected peer set is link-derived (engine:10221-10228), so it
      # polls and times out too. Capture the rc rather than let pipefail kill
      # the step before the proof runs.
      - name: SONiC precheck (VM) — asymmetric declaration, REQ-45C-24 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -rf /tmp/wi3_asym
          ./src/cassian.py up topologies/sonic-bgp-asymmetric.yaml --reconfigure
          set +e
          ./src/cassian.py test sonic-bgp-asymmetric > /tmp/wi3_asym.out 2>&1
          echo "cassian test rc=$? (a FAIL here is expected: the pair cannot converge)"
          set -e
          cp -r labs/clab-sonic-bgp-asymmetric /tmp/wi3_asym
          ./src/cassian.py down sonic-bgp-asymmetric
          python tests/sonic_precheck_proof.py req24 /tmp/wi3_asym/results.json

      # --- Cycle C: symmetric non-converging. Same capture discipline. The
      # evidence is the §13-grade timeout text (cassian_nos_sonic.py:767-778),
      # which lives only in the run's output.
      - name: SONiC precheck (VM) — symmetric non-converging, REQ-45C-29 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ./src/cassian.py up topologies/sonic-bgp-nonconverging.yaml --reconfigure
          set +e
          ./src/cassian.py test sonic-bgp-nonconverging > /tmp/wi3_nonconv.out 2>&1
          echo "cassian test rc=$? (a FAIL here is expected: REQ-45C-29)"
          set -e
          ./src/cassian.py down sonic-bgp-nonconverging
          python tests/sonic_precheck_proof.py req29 /tmp/wi3_nonconv.out

      # --- Cycle D: REQ-45C-5 control + positive. Founder ruling 2026-08-26
      # option 1 — BOTH labs up CONCURRENTLY, so the proof reads both guests in
      # one invocation and §15.2's "the same address that was ABSENT in the
      # control is now PRESENT" is structural, not dependent on CI pairing them.
      # Lab names differ, so containerlab namespaces them separately. This is
      # the first concurrent-lab step in this workflow.
      - name: SONiC precheck (VM) — downed daemon named, REQ-45C-9 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # req9 MUTATES the guest: it stops and restarts `bgp` through the
          # product's own runtime seam (LD-45C-R5 R1 -- no ssh/systemctl enters
          # this workflow). Restoration is structural inside the proof and is
          # asserted on the restart's own verdict. This step DOWNS ITS OWN LAB,
          # matching every sibling (VM) step -- :415, :435, :453, :490-491. The
          # teardown sweep below is the if:always() safety net for a step that
          # dies mid-way (LD-45C-R5 R4), NOT the primary cleanup.
          ./src/cassian.py up topologies/sonic-bgp-daemon-stop.yaml --reconfigure
          python tests/sonic_precheck_proof.py req9 \
            topologies/sonic-bgp-daemon-stop.yaml sonic-bgp-daemon-stop
          ./src/cassian.py down sonic-bgp-daemon-stop

      - name: SONiC address control (VM) — REQ-45C-5 control + positive (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ./src/cassian.py up topologies/sonic-control-unprovisioned.yaml --reconfigure
          ./src/cassian.py up topologies/sonic-base-lifecycle.yaml --reconfigure
          python tests/sonic_lifecycle_proof.py req5 \
            topologies/sonic-control-unprovisioned.yaml sonic-control-unprovisioned \
            topologies/sonic-base-lifecycle.yaml sonic-base-lifecycle
          ./src/cassian.py down sonic-base-lifecycle
          ./src/cassian.py down sonic-control-unprovisioned


      # --- Cycle E: the SCENARIO wait_for_bgp action (REQ-45C-10 / REQ-45C-30).
      # LD-45C-R12 fixtures · R13 proof home · R14 this wiring · R15 positive
      # non-vacuity · R16 negative two-surface assertion. Each lab-bearing step
      # DOWNS ITS OWN LAB (R14 R2); the sweep below is the if:always() safety
      # net for a step that dies mid-way, NOT the primary cleanup.
      - name: SONiC scenario wait_for_bgp (VM) — converging pair, REQ-45C-10 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -rf /tmp/wi3_wfb_pos
          ./src/cassian.py up topologies/sonic-bgp-scenario-wait.yaml --reconfigure
          ./src/cassian.py test sonic-bgp-scenario-wait --scenario sonic_wait_for_bgp_positive
          cp -r labs/clab-sonic-bgp-scenario-wait /tmp/wi3_wfb_pos
          ./src/cassian.py down sonic-bgp-scenario-wait
          python tests/sonic_wait_for_bgp_proof.py req10 /tmp/wi3_wfb_pos/results.json

      # `--scenario` by NAME, never `--all-scenarios` (founder ruling, session 13
      # R3): a scenario added to either fixture later cannot then enter this leg
      # silently. It also keeps this step off REQ-45C-29's surface -- with
      # scenarios requested the global control-plane precheck does not run, and
      # declared tests are skipped, so the two legs share a fixture and share no
      # evidence.
      - name: SONiC scenario wait_for_bgp (VM) — non-converging timeout, REQ-45C-10 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -rf /tmp/wi3_wfb_neg
          ./src/cassian.py up topologies/sonic-bgp-nonconverging.yaml --reconfigure
          set +e
          ./src/cassian.py test sonic-bgp-nonconverging --scenario sonic_wait_for_bgp_negative > /tmp/wi3_wfb_neg.out 2>&1
          echo "cassian test rc=$? (a FAIL here is expected: REQ-45C-10 negative leg)"
          set -e
          cp -r labs/clab-sonic-bgp-nonconverging /tmp/wi3_wfb_neg
          ./src/cassian.py down sonic-bgp-nonconverging
          python tests/sonic_wait_for_bgp_proof.py req10neg \
            /tmp/wi3_wfb_neg/results.json /tmp/wi3_wfb_neg.out

      # LD-45C-R16 R5: this leg carries its OWN capture path. It does not reuse
      # /tmp/wi3_nonconv.out and does not share the REQ-45C-29 step -- R14 R5's
      # no-step-sharing half survives R16 and is honoured here.

      # LD-45C-R14 R6: the lab-free schema leg stands up nothing, so it takes no
      # up/down and is NOT added to the teardown sweep.
      - name: SONiC scenario wait_for_bgp — schema regression, REQ-45C-30 (§4.5-c WI-3)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python tests/sonic_wait_for_bgp_proof.py schema
      # --- Teardown sweep. Any cycle that failed mid-step leaves a lab behind;
      # a leaked lab poisons the next run rather than the one that caused it.
      # `|| true` per lab: this step must not itself become a failure source.
      # --- Cycle F: §4.5-c WI-1 packet 2 — the two preconfigured-mode (VM)
      # rows. LD-45C-R30 R2 fixes the shape of both steps. They differ, and
      # the difference is the point:
      #   row 4  — resolve-time evidence, DEPLOYS NOTHING (LD-45C-R29 R1/R3),
      #            so no up/down and NOT in the sweep below (LD-45C-R14 R6).
      #   row 26 — boots one guest, so it DOWNS ITS OWN LAB as its last action
      #            (R14 R2) and IS in the sweep (R14 R3).
      # LD-45C-R20 R5: neither discharges REQ-45C-4/-26/-27 until both packets
      # have landed and these legs are green.

      - name: SONiC mixed-mode resolution (VM) — REQ-45C-4 row 4 (§4.5-c WI-1)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # No `up` and no `down`: the leg runs `cassian gen` in a temporary
          # workspace and asserts on topology.resolved.yaml, written before
          # deploy. A step that deploys nothing takes no up/down (R14 R6).
          python tests/sonic_preconfigured_proof.py mode4

      - name: SONiC preconfigured boot (VM) — REQ-45C-26 row 26 (§4.5-c WI-1)
        if: success() || failure()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ./src/cassian.py up topologies/sonic-preconfigured-boot.yaml --reconfigure
          python tests/sonic_preconfigured_proof.py req26 \
            topologies/sonic-preconfigured-boot.yaml sonic-preconfigured-boot
          ./src/cassian.py down sonic-preconfigured-boot

      - name: SONiC (VM) teardown sweep (§4.5-c WI-3)
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          ./src/cassian.py down probe-sonic-bgp-pair || true
          ./src/cassian.py down sonic-bgp-asymmetric || true
          ./src/cassian.py down sonic-bgp-nonconverging || true
          ./src/cassian.py down sonic-base-lifecycle || true
          ./src/cassian.py down sonic-control-unprovisioned || true
          ./src/cassian.py down sonic-bgp-daemon-stop || true
          ./src/cassian.py down sonic-bgp-scenario-wait || true
          # §4.5-c WI-1 packet 2: row 26's lab only. sonic-mode-mixed is NOT
          # here and must not be added -- it is never deployed, so there is
          # nothing to leak (LD-45C-R14 R6, LD-45C-R29 R1).
          ./src/cassian.py down sonic-preconfigured-boot || true

      - name: Upload artifacts (always; bounded on success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassian-labs
          path: |
            labs/**/results.json
            labs/**/results.summary.txt
            labs/**/topology.resolved.yaml
            labs/**/two_run/**
            labs/**/artifacts/**
          if-no-files-found: ignore

      - name: Upload full labs on failure (evidence bundle)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cassian-labs-full-on-failure
          path: |
            labs/**
          if-no-files-found: ignore

