[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cassian-gate"
version = "2.1.0"
description = "Deterministic pre-production proof layer for network changes"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "PyYAML",
  "openai",
  "httpx",
  "pydantic",
  "tqdm",
  "annotated-types",
  "typing-extensions",
]

[project.scripts]
cassian = "cassian:main"

[tool.setuptools]
py-modules = [
  "cassian",
  "cassian_cli",
  "cassian_engine",
  "cassian_ai",
  "cassian_candidate",
  "cassian_state",
  "cassian_two_run",
  "cassian_artifacts",
  "cassian_common",
  "cassian_model",
  "cassian_runtime_container",
  "cassian_tests",
  "cassian_import",
  "cassian_nos_types",
  "cassian_nos_frr",
  "cassian_nos_sonic",
  "cassian_runtime_vm",
]

[tool.setuptools.package-dir]
"" = "src"
