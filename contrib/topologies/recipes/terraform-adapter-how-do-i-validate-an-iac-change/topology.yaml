name: terraform-adapter-recipe

nodes:
  - name: h1
    type: host
    ip: 10.50.1.10/24
    gw: 10.50.1.1

  - name: h2
    type: host
    ip: 10.50.2.10/24
    gw: 10.50.2.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 10.50.1.1/24
      eth2: 10.50.2.1/24
    allow_icmp: true
    allow_tcp: [443]

links:
  - endpoints: ["h1:eth1", "fw1:eth1"]
  - endpoints: ["h2:eth1", "fw1:eth2"]

tests:
  - name: h1_tcp_443_to_h2
    kind: tcp
    src: h1
    dst: h2
    port: 443
    listener: true
    expect: pass