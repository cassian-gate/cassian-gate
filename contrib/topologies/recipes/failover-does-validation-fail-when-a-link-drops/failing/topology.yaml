name: recipe-failover-link-drop-fail

nodes:
  - name: h1
    type: host
    ip: 192.168.1.10/24
    gw: 192.168.1.1

  - name: fw1
    type: nft-fw
    routed: true
    interfaces:
      eth1: 192.168.1.1/24
    allow_icmp: true

links:
  - endpoints: ["h1:eth1", "fw1:eth1"]

tests:
  - name: h1_to_fw1_ping_should_pass
    kind: ping
    src: h1
    dst: fw1
    expect: fail
    count: 1

scenarios:
  - id: link_drop_failover_recovers
    description: "Use the same direct interface bounce choreography but keep an intentionally wrong declared expectation so validation fails."
    steps:
      - run: h1_to_fw1_ping_should_pass

      - fault:
          interface_down:
            node: fw1
            if: eth1

      - wait_for:
          type: ping
          from: h1
          to: 192.168.1.1
          expect: fail
          timeout: 10
          interval_s: 1.0

      - fault:
          interface_up:
            node: fw1
            if: eth1

      - wait_for:
          type: ping
          from: h1
          to: 192.168.1.1
          expect: pass
          timeout: 10
          interval_s: 1.0

      - run: h1_to_fw1_ping_should_pass