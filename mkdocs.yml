# mkdocs.yml — cassiangate.dev documentation site
#
# Public mkdocs-material site for Cassian Gate.
# Handover H7 (Phase 1a §4.6). Strict-build enforced via `strict: true`.
# Build determinism (D01) depends on pinned versions in requirements-docs.txt.
#
# Note: nav references three new pages (index.md, proof-kit.md,
# project-principles.md) authored by WI-7 / WI-8 / WI-9. `mkdocs build --strict`
# will FAIL at WI-1 lock because those targets don't exist yet, and will
# pass only after WI-9 completes. WI-1 verifies `mkdocs config` parse
# validity, not strict-build success.

site_name: Cassian Gate
site_url: https://docs.cassiangate.dev/
site_description: Deterministic pre-production network change validation gate.

docs_dir: docs

exclude_docs: |
  /README.md

not_in_nav: |
  /404.md
  /blog/v2-1-release.md

strict: true

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    # Dark default (REQ-H7-2)
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light alternate
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # Navigation (v3 UI-5)
    - navigation.tabs
    - navigation.instant
    - navigation.top
    # Search (v3 UI-5)
    - search.highlight
    - search.suggest
    # Code blocks (v3 UI-5)
    - content.code.copy
    - content.code.annotate
    # Table of contents (v3 UI-5)
    - toc.follow

markdown_extensions:
  # Built-in python-markdown extensions (v3 UI-5)
  - admonition
  - attr_list
  - md_in_html
  # pymdown-extensions (v3 UI-5)
  - pymdownx.details
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mike:
      canonical_version: latest

extra:
  # mike versioning (REQ-H7-18 / LD-6)
  version:
    provider: mike
    default: latest

nav:
  # Eight baseline sections per REQ-H7-3 plus LD-3 entries
  # applied at WI-10 (Cheatsheet, Input Adapters, VM Runtime Capabilities,
  # AI Advisory, Extension & Adoption, plus interim First-run failure
  # narrative pending BL-N relocation to contrib/topologies/first-run-proof/).
  - Home: index.md
  - Quickstart: quickstart.md
  - Topology Schema Reference: topology-schema-v1.5.md
  - Legacy schema (v1): topology-schema-v1.md
  - CLI Reference: cli-reference-v1.md
  - Cheatsheet: cheatsheet.md
  - Writing a user-defined invariant: recipes/exec-user-defined-invariants.md
  - The AI-change reference case: recipes/ai-change-reference-case.md

  - CI Integration:
    - GitHub Actions: ci/github-actions.md
    - GitLab CI: ci/gitlab-ci.md
  - Input Adapters: input-adapters.md
  - Brownfield Importer: brownfield-importer.md
  - Admin Guide: admin-guide-v1.md
  - VM Runtime Capabilities: vm-runtime-capabilities.md
  - Proof Kit / Examples: proof-kit.md
  - Audit-Grade Evidence: audit-grade-evidence.md
  - AI Advisory:
    - Overview: ai/README.md
    - Guardrails: ai/guardrails.md
    - CLI Contract: ai/cli-contract-ai.md
    - Online AI: ai/online_ai.md
  - Extension & Adoption: extensions/extension-and-adoption.md
  - Project principles: project-principles.md
  - Scope and scale discipline: scope-discipline.md
